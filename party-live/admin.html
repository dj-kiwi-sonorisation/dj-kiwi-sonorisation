<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ KIWI · Party Live Régie</title><style>:root{color-scheme:dark}body{margin:0;background:#0b120e;color:#eef7ec;font:16px system-ui}main{max-width:780px;margin:auto;padding:24px 16px}.logo{text-align:center;font-size:32px;font-weight:900;color:#b8ff72}.sub{text-align:center;color:#a8c0ad}.panel{background:#19271e;padding:20px;border-radius:18px;margin:16px 0}button,.link{display:inline-block;cursor:pointer;border:0;border-radius:10px;background:#b8ff72;color:#10200c;font-weight:800;padding:12px 15px;text-decoration:none;font:inherit}button:disabled{opacity:.45;cursor:not-allowed}input,select{box-sizing:border-box;width:100%;padding:12px;background:#101b14;color:white;border:1px solid #4a5d4d;border-radius:9px;font:inherit}label{display:block;margin:14px 0 5px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{background:#1b2b20;padding:18px;border-radius:16px}.tile h2{margin:0 0 8px;font-size:20px}.tile p{color:#c3d3c6}.tile a,.tile button{width:100%;box-sizing:border-box;text-align:center}small{color:#c0d0c2}.muted{color:#a8baac}.item{padding:12px;border-top:1px solid #344d38}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row button{padding:8px}.danger{background:#ffd6d6}.hidden,[hidden]{display:none!important}#notice,#message{white-space:pre-wrap;margin:12px 0}</style></head><body><main><div class="logo">🥝 DJ KIWI</div><div class="sub">PARTY LIVE · RÉGIE DJ</div><section class="panel" id="login"><h2>Connexion DJ</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"><p><button id="connect">Connexion</button></p></section><div id="controls" hidden><section class="panel"><div class="row"><button id="reload">Actualiser</button><button id="logout" class="danger">Déconnexion</button><a class="link" href="../music-request/admin.html">Gestion Music Request / soirées</a></div><p id="event"></p><label>Historique par soirée</label><select id="events"></select><p class="muted">Les soirées s'ouvrent et se clôturent depuis Music Request Admin.</p></section><section class="panel"><h2>🎤 File karaoké</h2><div id="karaoke"></div></section><section class="panel"><h2>📊 Tendances d'ambiance</h2><div id="mood"></div></section></div><div id="message" role="status"></div></main><script src="config.js?v=party1"></script><script>
const c=window.KIWI_CONFIG,$=id=>document.getElementById(id);let token='',events=[],selected='',rows=[];
async function api(path,options={}){const r=await fetch(c.supabaseUrl+path,{...options,headers:{apikey:c.supabaseAnonKey,Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});const t=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' : '+t.slice(0,350));return t?JSON.parse(t):null}
function message(t){$('message').textContent=t}
$('connect').onclick=async()=>{try{const r=await fetch(c.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const t=await r.text(),d=t?JSON.parse(t):{};if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Connexion impossible');token=d.access_token;$('login').hidden=true;$('controls').hidden=false;await load()}catch(e){message('❌ '+e.message)}};
async function load(){if(!token)return;try{events=await api('/rest/v1/dj_events?select=id,name,closed_at&order=created_at.desc&limit=500');const s=$('events'),old=selected;s.replaceChildren();for(const e of events){const o=document.createElement('option');o.value=e.id;o.textContent=e.name+(e.closed_at?' · clôturée':' · ouverte');s.append(o)}selected=events.some(e=>e.id===old)?old:(events.find(e=>!e.closed_at)?.id||events[0]?.id||'');s.value=selected;$('event').textContent=events.find(e=>e.id===selected)?.name||'Aucune soirée';await loadData();message('Mis à jour : '+new Date().toLocaleTimeString('fr-FR'))}catch(e){message('❌ '+e.message)}}
async function loadData(){const k=$('karaoke'),m=$('mood');k.replaceChildren();m.replaceChildren();if(!selected){k.textContent='Aucune soirée';return}rows=await api('/rest/v1/kiwi_karaoke?select=id,singer,song,artist,status,position&event_id=eq.'+encodeURIComponent(selected)+'&order=position.asc&limit=1000');if(!rows.length)k.textContent='Aucune inscription';for(const r of rows){const el=document.createElement('div');el.className='item';const strong=document.createElement('strong');strong.textContent=r.singer+' — '+r.song+(r.artist?' ('+r.artist+')':'');el.append(strong);const p=document.createElement('p');p.className='muted';p.textContent=({pending:'En attente',called:'Appelé',sung:'Chanté'})[r.status];el.append(p);const buttons=document.createElement('div');buttons.className='row';for(const [status,label] of [['called','Appeler'],['sung','Chanté'],['pending','Remettre en attente']]){const b=document.createElement('button');b.textContent=label;b.disabled=r.status===status;b.onclick=async()=>{try{await api('/rest/v1/kiwi_karaoke?id=eq.'+encodeURIComponent(r.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status})});await loadData()}catch(e){message('❌ '+e.message)}};buttons.append(b)}const del=document.createElement('button');del.className='danger';del.textContent='Supprimer';del.onclick=async()=>{if(!confirm('Supprimer cette inscription ?'))return;try{await api('/rest/v1/kiwi_karaoke?id=eq.'+encodeURIComponent(r.id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await loadData()}catch(e){message('❌ '+e.message)}};buttons.append(del);el.append(buttons);k.append(el)}const votes=await api('/rest/v1/kiwi_mood_votes?select=style&event_id=eq.'+encodeURIComponent(selected)+'&limit=10000');const counts={};for(const v of votes)counts[v.style]=(counts[v.style]||0)+1;m.textContent=votes.length+' avis reçu(s)';for(const [style,n] of Object.entries(counts).sort((a,b)=>b[1]-a[1])){const d=document.createElement('div');d.className='item';d.textContent=style+' : '+n+' ('+Math.round(n/votes.length*100)+' %)';m.append(d)}}
$('events').onchange=()=>{selected=$('events').value;loadData().catch(e=>message('❌ '+e.message))};$('reload').onclick=load;$('logout').onclick=()=>{token='';rows=[];events=[];selected='';$('controls').hidden=true;$('login').hidden=false;message('Déconnecté')};setInterval(()=>{if(token&&!document.hidden)load()},10000);
</script></body></html>
