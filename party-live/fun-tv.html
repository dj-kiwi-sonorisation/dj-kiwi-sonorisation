<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiwi Fun · TV Live</title><style>:root{color-scheme:dark}body{background:#0b120e;color:#eef7ec;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:18px}h1,h2{color:#b8ff72}.panel{background:#19271e;border-radius:16px;padding:18px;margin:14px 0}button,select,input,textarea{font:inherit;border-radius:10px;padding:11px;margin:5px 0}button{background:#b8ff72;color:#10200c;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.45}select,input,textarea{background:#0b120e;color:white;border:1px solid #55735b;max-width:100%;box-sizing:border-box}input,textarea{width:100%}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:#b1c3b5}.card{border:1px solid #4c694f;border-radius:12px;padding:12px;margin:8px 0}.big{font-size:36px}.bar{background:#324b36;height:19px;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#b8ff72,#ffb84a)}a{color:#b8ff72}#status{white-space:pre-wrap;color:#b8ff72}label{display:block;margin:10px 0 3px}</style></head><body><main style="max-width:1500px"><h1 style="text-align:center;font-size:clamp(32px,5vw,75px)">🥝 DJ KIWI — APP KIWI FUN</h1><p id="event" style="text-align:center"></p><div id="status"></div><section id="screen" class="panel" style="text-align:center;min-height:55vh"><h2>Animations en direct</h2></section><p class="muted" style="text-align:center">Scannez le QR code présent dans la salle pour participer !</p></main><script src="config.js"></script><script>const c=window.KIWI_CONFIG;const $=id=>document.getElementById(id);let eventId=null;const visitor=(()=>{let x=localStorage.getItem('kiwi_fun_visitor');if(!x){x=crypto.randomUUID();localStorage.setItem('kiwi_fun_visitor',x)}return x})();async function api(path,opt={}){if(!c?.supabaseUrl||!c?.supabaseAnonKey)throw Error('Configuration Supabase manquante');let r=await fetch(c.supabaseUrl+path,{...opt,headers:{apikey:c.supabaseAnonKey,'Content-Type':'application/json',...(opt.headers||{})}});let t=await r.text();if(!r.ok)throw Error(t.slice(0,240));return t?JSON.parse(t):null}async function rpc(name,data,token){return api('/rest/v1/rpc/'+name,{method:'POST',headers:token?{Authorization:'Bearer '+token}:{},body:JSON.stringify(data)})}async function activeEvent(){let a=await api('/rest/v1/dj_events?select=id,name&closed_at=is.null&limit=1');if(!a.length)throw Error('Aucune soirée ouverte');eventId=a[0].id;$('event').textContent='🎉 '+a[0].name;return a[0]}function msg(t){$('status').textContent=t}function esc(t){return String(t??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}let settings={},stats={};async function load(){try{await activeEvent();await refresh()}catch(e){msg(e.message)}}async function refresh(){if(!eventId)return;try{let a=await api('/rest/v1/kiwi_fun_settings?event_id=eq.'+eventId+'&select=*&limit=1');settings=a[0]||{};stats=await rpc('kiwi_fun_stats',{p_event:eventId});render()}catch(e){msg(e.message)}}async function render(){let v=stats.votes||{},html='',screen=settings.screen||'karaoke';let total=Object.entries(v).filter(([k])=>k.startsWith('mood:')).reduce((n,[k,c])=>n+c,0);if(screen==='mood'){let moods=['😴','😌','😊','🥳','🔥'];let avg=total?Math.round(moods.reduce((n,m,i)=>n+i*(v['mood:'+m]||0),0)/total/4*100):0;html='<h2>🌡️ MÉTÉO DE L’AMBIANCE</h2><div class="big" style="font-size:10vw">'+avg+'%</div><div class="bar"><div class="fill" style="width:'+avg+'%"></div></div><p>'+moods.map(m=>m+' '+(v['mood:'+m]||0)).join(' &nbsp; ')+'</p><p>'+total+' vote(s)</p>';if(avg>=80)html+='<h1>🔥 LA SALLE EST EN FEU ! 🎉</h1>'}else if(screen==='boost'){let count=stats.boost||0,threshold=settings.boost_threshold||10;html='<h2>🔥 KIWI PARTY BOOST</h2><div class="big" style="font-size:12vw">'+count+' / '+threshold+'</div><div class="bar"><div class="fill" style="width:'+Math.min(100,count/threshold*100)+'%"></div></div><h1>'+(count>=threshold?'🎉 OBJECTIF ATTEINT ! 🎉':'TOUS ENSEMBLE, METTEZ LE FEU !')+'</h1>'}else if(screen==='styles'){let styles=['Années 80','Années 90','Années 2000','Latino','Électro','Rock','Rap / RnB','Variété','Disco'];let max=Math.max(1,...styles.map(s=>v['style:'+s]||0));html='<h2>🎶 VOTE MUSICAL</h2>'+styles.map(s=>'<div class="row"><strong style="width:160px">'+esc(s)+'</strong><div class="bar" style="flex:1"><div class="fill" style="width:'+((v['style:'+s]||0)/max*100)+'%"></div></div><b>'+(v['style:'+s]||0)+'</b></div>').join('')}else if(screen==='messages'){html='<h2>💌 VOS DÉDICACES</h2>'+(stats.messages||[]).slice(0,5).map(x=>'<div class="card"><h2>'+esc(x.author)+'</h2><p style="font-size:2vw">'+esc(x.body)+'</p></div>').join('')||'Aucun message validé'}else if(screen==='photo_challenge'){html='<h2>📸 DÉFI PHOTO</h2><div class="big" style="font-size:5vw">'+esc(settings.photo_prompt||'Le prochain défi arrive !')+'</div>'}else if(screen==='wheel'){html='<h2>🎡 LA ROUE DES DÉFIS</h2><div class="big" style="font-size:6vw">'+esc(settings.wheel_result||'Préparez-vous !')+'</div>'}else if(screen==='quiz'){let q=await rpc('kiwi_fun_question',{p_event:eventId});html='<h2>🧠 QUIZ LIVE</h2>';if(q){html+='<h2 style="font-size:3vw">'+esc(q.question)+'</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+q.choices.map((x,i)=>'<div class="card" style="font-size:2.2vw">'+['A','B','C','D'][i]+'. '+esc(x)+'</div>').join('')+'</div><p>'+(q.open?'📱 Répondez sur votre téléphone !':'⏳ Réponses clôturées')+'</p>';if(q.reveal)html+='<h2>Réponse révélée par le DJ</h2>'}html+='<h2>🏆 CLASSEMENT</h2>'+((stats.leaders||[]).slice(0,5).map((x,i)=>'<p>'+(i+1)+'. '+esc(x.name)+' — '+x.score+' points</p>').join('')||'En attente des joueurs')}else{html='<h2>🎤 KARAOKÉ / PHOTOS</h2><p>Ouvre <a href="tv.html">l’écran karaoké classique</a> pour afficher les chanteurs et les photos.</p>'}$('screen').innerHTML=html}load();setInterval(refresh,3000);</script></body></html>
