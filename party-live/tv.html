<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ KIWI — TV universelle</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09120e;color:#f4fff3;font-family:system-ui,Arial,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column;padding:clamp(10px,1.4vw,26px);gap:clamp(8px,1vh,16px)}header{text-align:center;font-size:clamp(24px,2.7vw,58px);font-weight:900;color:#b8ff72}#event{text-align:center;color:#c3d9c6;font-size:clamp(13px,1.3vw,24px)}#tiles{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(8px,1vw,22px);min-height:0}.tile{background:#182b21;border:2px solid #3d6546;border-radius:clamp(12px,1.5vw,25px);padding:clamp(12px,1.8vw,34px);min-width:0;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;gap:clamp(5px,.8vh,15px)}.tile h2{font-size:clamp(18px,2vw,44px);color:#b8ff72;margin:0}.big{font-size:clamp(28px,4vw,85px);font-weight:900;overflow-wrap:anywhere}.detail{font-size:clamp(14px,1.7vw,36px);overflow-wrap:anywhere}.bar{height:clamp(10px,1.5vw,22px);width:95%;background:#35513b;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#b8ff72,#ffba50)}.photoGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7vw;width:100%;min-height:0}.photoGrid img{width:100%;height:clamp(85px,15vh,280px);object-fit:contain;background:#25392c;border-radius:10px}.photoGrid span{font-size:clamp(10px,1vw,20px)}.photoCell{min-width:0;overflow:hidden}#tiles[data-count="1"]{grid-template-columns:1fr}#tiles[data-count="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}#tiles[data-count="3"] .tile:first-child{grid-column:span 2}#tiles[data-count="5"],#tiles[data-count="6"]{grid-template-columns:repeat(3,minmax(0,1fr))}#tiles[data-count="7"],#tiles[data-count="8"],#tiles[data-count="9"]{grid-template-columns:repeat(3,minmax(0,1fr))}.tile:has(.photoGrid){grid-column:span 1}.tile .detail{max-width:100%}@media(max-width:760px),(orientation:portrait){#tiles{grid-template-columns:1fr!important;grid-auto-rows:auto}#tiles .tile{grid-column:auto!important;min-height:190px}.photoGrid img{height:120px}}@media(min-width:1400px){#tiles[data-count="4"] .tile{min-height:34vh}}footer{text-align:center;color:#9fbba5;font-size:clamp(11px,1vw,19px)}
</style></head><body><header>🥝 DJ KIWI — APP KIWI FUN</header><div id="event">Connexion à la soirée…</div><main id="tiles"><section class="tile"><h2>Bienvenue à la soirée !</h2></section></main><footer>📱 Scannez le QR code de la soirée pour participer !</footer><script src="config.js"></script><script>
const c=window.KIWI_CONFIG, el=id=>document.getElementById(id);let frame=0,lastEvent=null;
async function api(path){let r=await fetch(c.supabaseUrl+'/rest/v1/'+path,{headers:{apikey:c.supabaseAnonKey}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function rpc(name,data){let r=await fetch(c.supabaseUrl+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:c.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('RPC '+r.status);return r.json()}
const esc=x=>String(x??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));const tile=(title,content)=>'<section class="tile"><h2>'+title+'</h2>'+content+'</section>';
async function refresh(){try{let events=await api('dj_events?select=id,name&closed_at=is.null&limit=1');if(!events.length){el('event').textContent='Aucune soirée ouverte';el('tiles').innerHTML=tile('🎉 Bienvenue','<div class="detail">À bientôt pour une nouvelle soirée !</div>');return}let e=events[0],id=encodeURIComponent(e.id);el('event').textContent='🎉 '+e.name;let settings=(await api('kiwi_fun_settings?select=*&event_id=eq.'+id+'&limit=1'))[0]||{};let modules=Array.isArray(settings.tv_modules)?settings.tv_modules:['karaoke','photos'];let needsStats=modules.some(m=>['mood','boost','messages','styles','quiz'].includes(m));let [stats,k,mem]=await Promise.all([needsStats?rpc('kiwi_fun_stats',{p_event:e.id}):{},modules.includes('karaoke')?api('kiwi_karaoke_tv_state?select=current_id,next_id,called_id&event_id=eq.'+id+'&limit=1'):[],modules.includes('photos')?api('kiwi_memories?select=guest_name,message,photo_path&event_id=eq.'+id+'&approved=eq.true&is_challenge=eq.false&order=created_at.desc&limit=60'):[]]);let state=k[0]||{},ids=[state.current_id,state.next_id,state.called_id].filter(Boolean),people=ids.length?await api('kiwi_karaoke?select=id,singer,song&event_id=eq.'+id+'&id=in.('+ids.map(encodeURIComponent).join(',')+')'):[],person=key=>people.find(p=>p.id===key);let challengePhotos=modules.includes('photo_challenge')?await api('kiwi_memories?select=guest_name,photo_path,challenge_prompt&event_id=eq.'+id+'&approved=eq.true&is_challenge=eq.true&order=created_at.desc&limit=60'):[];let votes=stats.votes||{},html='';
for(let m of modules){if(m==='karaoke'){let a=person(state.current_id),b=person(state.next_id);html+=tile('🎤 KARAOKÉ LIVE','<div class="detail">AU MICRO</div><div class="big">'+esc(a?.singer||'En attente')+'</div><div class="detail">'+esc(a?.song||'')+'</div><div class="detail">⏭️ PROCHAIN : <strong>'+esc(b?.singer||'À annoncer')+'</strong> '+esc(b?.song||'')+'</div>')}
else if(m==='photos'){let batch=mem.length?mem.slice(frame%mem.length).concat(mem.slice(0,frame%mem.length)).slice(0,4):[];html+=tile('📸 PHOTOS',batch.length?'<div class="photoGrid">'+batch.map(x=>'<div class="photoCell">'+(x.photo_path?'<img alt="Photo de soirée" src="'+esc(c.supabaseUrl+'/storage/v1/object/public/kiwi-party-photos/'+x.photo_path)+'">':'')+'<span>'+esc(x.guest_name||'Invité')+'</span></div>').join('')+'</div>':'<div class="detail">Partagez vos souvenirs !</div>')}
else if(m==='mood'){let moods=['😴','😌','😊','🥳','🔥'],total=moods.reduce((a,v)=>a+(votes['mood:'+v]||0),0),avg=total?Math.round(moods.reduce((a,v,i)=>a+i*(votes['mood:'+v]||0),0)/total/4*100):0;html+=tile('🌡️ MOOD LIVE','<div class="big">'+avg+' %</div><div class="bar"><div class="fill" style="width:'+avg+'%"></div></div><div class="detail">'+total+' vote(s) · '+(avg>=80?'🔥 Salle en feu !':'Quelle est votre humeur ?')+'</div>')}
else if(m==='boost'){let count=stats.boost||0,goal=settings.boost_threshold||10;html+=tile('🔥 PARTY BOOST','<div class="big">'+count+' / '+goal+'</div><div class="bar"><div class="fill" style="width:'+Math.min(100,100*count/goal)+'%"></div></div><div class="detail">'+(count>=goal?'🎉 Objectif atteint !':'Tous ensemble !')+'</div>')}
else if(m==='messages'){let messages=stats.messages||[];html+=tile('💌 MESSAGES',messages.length?'<div class="detail">« '+esc(messages[frame%messages.length].body)+' »</div><div class="detail">— '+esc(messages[frame%messages.length].author)+'</div>':'<div class="detail">Envoyez vos dédicaces !</div>')}
else if(m==='photo_challenge'){let current=challengePhotos.filter(x=>x.challenge_prompt===settings.photo_prompt);let batch=current.length?current.slice(frame%current.length).concat(current.slice(0,frame%current.length)).slice(0,4):[];html+=tile('📸 DÉFI PHOTO','<div class="detail">'+esc(settings.photo_prompt||'Défi à venir')+'</div>'+(batch.length?'<div class="photoGrid">'+batch.map(x=>'<div class="photoCell"><img alt="Participation au défi" src="'+esc(c.supabaseUrl+'/storage/v1/object/public/kiwi-party-photos/'+x.photo_path)+'"><span>'+esc(x.guest_name||'Invité')+'</span></div>').join('')+'</div>':'<div class="detail">En attente des photos du défi…</div>'))}
else if(m==='wheel'){html+=tile('🎡 ROUE DES DÉFIS','<div class="detail">'+esc(settings.wheel_result||'Un défi arrive !')+'</div>')}
else if(m==='styles'){let labels=['Années 80','Années 90','Années 2000','Latino','Électro','Rock','Rap / RnB','Variété','Disco'];let ranking=labels.map(x=>[x,votes['style:'+x]||0]).sort((a,b)=>b[1]-a[1]);html+=tile('🎶 VOTE MUSICAL','<div class="big">'+esc(ranking[0][0])+'</div><div class="detail">'+ranking[0][1]+' vote(s) · '+esc(ranking.slice(1,3).map(x=>x[0]+' '+x[1]).join(' / '))+'</div>')}
else if(m==='quiz'){let q=await rpc('kiwi_fun_question',{p_event:e.id});html+=tile('🧠 QUIZ LIVE',q?'<div class="detail">'+esc(q.question)+'</div><div class="detail">'+q.choices.map((v,i)=>'ABCD'[i]+'. '+esc(v)).join(' · ')+'</div>':'<div class="detail">En attente de la prochaine question</div>')}}
el('tiles').dataset.count=String(modules.length);el('tiles').innerHTML=html||tile('🎉 Bienvenue à la soirée !','<div class="detail">Scannez le QR code pour participer.</div>');frame+=4;lastEvent=e.id}catch(err){el('event').textContent='Connexion TV : '+err.message}}
refresh();setInterval(refresh,9000);
</script></body></html>
