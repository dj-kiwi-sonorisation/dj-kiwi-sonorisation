<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ KIWI · TV Karaoké</title><style>
*{box-sizing:border-box}body{margin:0;background:#08100b;color:#fff;font-family:system-ui,Arial,sans-serif;min-height:100vh;padding:1.6vw 2vw;display:flex;flex-direction:column;gap:1.5vh}header{text-align:center;color:#b8ff72;font-weight:900;font-size:clamp(32px,3.7vw,78px);line-height:1.1}#event{text-align:center;color:#b4cbb6;font-size:clamp(16px,1.5vw,28px);margin:0}main{display:grid;grid-template-columns:1fr 1fr;gap:2vw;min-height:40vh}.tile{border:2px solid #375b3d;background:#172b1d;border-radius:22px;padding:2.2vw;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1.6vh;min-width:0}.tile.next{background:#142735;border-color:#3a5b73}.tile h2{font-size:clamp(25px,2.7vw,54px);color:#b8ff72;margin:0}.tile.next h2{color:#a7deff}.person{font-size:clamp(38px,4.7vw,100px);font-weight:900;line-height:1.1;overflow-wrap:anywhere}.song{font-size:clamp(23px,2.7vw,58px);font-weight:600;overflow-wrap:anywhere}.memories{background:#172b1d;border:2px solid #375b3d;border-radius:22px;text-align:center;padding:1.5vw 2vw;flex:1;min-height:20vh}.memories h2{color:#b8ff72;font-size:clamp(24px,2.5vw,48px);margin:0 0 1vh}.memories #memory{font-size:clamp(20px,2.1vw,40px)}.memories p{margin:.5vh 0}.photo{max-height:20vh;max-width:90%;object-fit:contain;border-radius:12px}@media(max-width:700px){main{grid-template-columns:1fr}.tile{min-height:26vh}.person{font-size:clamp(34px,9vw,70px)}.song{font-size:clamp(22px,5vw,40px)}}
</style></head><body><header>🥝 DJ KIWI · KARAOKÉ LIVE</header><p id="event">Chargement…</p><main><section class="tile"><h2>🎤 AU MICRO</h2><div id="currentName" class="person">—</div><div id="currentSong" class="song"></div></section><section class="tile next"><h2>⏭️ PROCHAIN CHANTEUR</h2><div id="nextName" class="person">—</div><div id="nextSong" class="song"></div></section></main><section class="memories"><h2>📸 SOUVENIRS VALIDÉS</h2><div id="memory">—</div></section><script src="config.js?v=party2"></script><script>
const c=window.KIWI_CONFIG,$=id=>document.getElementById(id);let frame=0;
async function api(path){const r=await fetch(c.supabaseUrl+'/rest/v1/'+path,{headers:{apikey:c.supabaseAnonKey}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function fill(id,person,empty){$(id+'Name').textContent=person?person.singer:empty;$(id+'Song').textContent=person?person.song:''}
async function refresh(){try{const a=await api('dj_events?select=id,name&closed_at=is.null&limit=1'),e=a[0];if(!e){$('event').textContent='Aucune soirée ouverte';fill('current',null,'En attente');fill('next',null,'En attente');$('memory').textContent='Aucune soirée ouverte';return}
$('event').textContent='🎉 '+e.name;const id=encodeURIComponent(e.id);
const [k,mem]=await Promise.all([api('kiwi_karaoke_tv_state?select=current_id,next_id,called_id&event_id=eq.'+id+'&limit=1'),api('kiwi_memories?select=guest_name,message,photo_path&event_id=eq.'+id+'&approved=eq.true&order=created_at.desc&limit=40')]);
const state=k[0]||{};const ids=[state.current_id,state.next_id,state.called_id].filter(Boolean);
const people=ids.length?await api('kiwi_karaoke?select=id,singer,song&event_id=eq.'+id+'&id=in.('+ids.map(encodeURIComponent).join(',')+')'):[];
const person=key=>people.find(p=>p.id===key);
fill('current',person(state.current_id),state.called_id&&person(state.called_id)?'En attente de '+person(state.called_id).singer:'En attente du chanteur');
fill('next',person(state.next_id),'À annoncer');
const target=$('memory');target.replaceChildren();if(mem.length){const x=mem[(frame++)%mem.length];const name=document.createElement('strong');name.textContent=x.guest_name||'Un invité';const msg=document.createElement('p');msg.textContent=x.message||'';target.append(name,msg);if(x.photo_path){const img=document.createElement('img');img.className='photo';img.alt='Souvenir partagé';img.src=c.supabaseUrl+'/storage/v1/object/public/kiwi-party-photos/'+x.photo_path;target.append(img)}}else target.textContent='Les souvenirs apparaîtront ici après validation.'
}catch(e){$('event').textContent='Connexion indisponible : '+e.message}}
refresh();setInterval(refresh,12000);
</script></body></html>
