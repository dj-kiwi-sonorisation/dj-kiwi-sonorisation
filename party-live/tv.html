<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ KIWI · Écran TV</title><style>body{background:#08100b;color:white;font:clamp(18px,2.3vw,38px) system-ui;text-align:center;margin:0;padding:3vw}header{font-size:1.7em;font-weight:900;color:#b8ff72}main{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:3vw}section{background:#18291e;border-radius:22px;padding:2vw;min-height:24vh}h2{font-size:.9em;color:#b8ff72;margin:0 0 1em}.big{font-size:1.5em;font-weight:bold}.photo{max-height:28vh;max-width:90%;border-radius:12px}.muted{color:#abc3ad;font-size:.65em}.bar{height:18px;background:#354938;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#b8ff72}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><header>🥝 DJ KIWI · PARTY LIVE</header><p id="event">Chargement…</p><main><section><h2 id="karaokeTitle">🎤 KARAOKÉ LIVE</h2><div id="singer" class="big">—</div><p id="next" class="muted"></p></section><section><h2>📊 AMBIANCE LIVE</h2><div id="moods">—</div></section><section><h2>🎲 DÉFI DU MOMENT</h2><div id="challenge">—</div></section><section><h2>📸 SOUVENIRS VALIDÉS</h2><div id="memory">—</div></section></main><p class="muted">Les demandes et animations sont gérées par DJ KIWI.</p><script src="config.js?v=party2"></script><script>const c=window.KIWI_CONFIG,$=id=>document.getElementById(id);let frame=0;async function api(path){const r=await fetch(c.supabaseUrl+'/rest/v1/'+path,{headers:{apikey:c.supabaseAnonKey}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function refresh(){try{const a=await api('dj_events?select=id,name&closed_at=is.null&limit=1'),e=a[0];if(!e){$('event').textContent='Aucune soirée ouverte';for(const id of ['singer','next','moods','challenge','memory'])$(id).textContent='—';return}$('event').textContent='🎉 '+e.name;const id=encodeURIComponent(e.id),[k,v,ch,mem]=await Promise.all([api('kiwi_karaoke_tv_state?select=mode,karaoke_id&event_id=eq.'+id+'&limit=1'),api('kiwi_mood_votes?select=style&event_id=eq.'+id+'&limit=10000'),api('kiwi_challenges?select=title,description&event_id=eq.'+id+'&active=eq.true&order=created_at.desc&limit=1'),api('kiwi_memories?select=guest_name,message,photo_path&event_id=eq.'+id+'&approved=eq.true&order=created_at.desc&limit=40')]);const state=k[0];let person=null;
if(state?.karaoke_id){const people=await api('kiwi_karaoke?select=singer,song&event_id=eq.'+id+'&id=eq.'+encodeURIComponent(state.karaoke_id)+'&limit=1');person=people[0]||null}
const mode=person?state?.mode:'idle';
$('karaokeTitle').textContent=({waiting:'📢 CHANTEUR APPELÉ',singing:'🎤 AU MICRO',next:'⏭️ PROCHAIN CHANTEUR',idle:'🎤 KARAOKÉ LIVE'})[mode]||'🎤 KARAOKÉ LIVE';
$('singer').textContent=mode==='singing'?person.singer+' — '+person.song:mode==='next'?person.singer+' — '+person.song:'En attente du prochain chanteur';
$('next').textContent=mode==='waiting'?'Appelé : '+person.singer+' — '+person.song:mode==='next'?'Prépare-toi à monter sur scène !':'';const counts={};for(const x of v)counts[x.style]=(counts[x.style]||0)+1;const m=$('moods');m.replaceChildren();for(const [style,n] of Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4)){const p=document.createElement('p');p.className='muted';p.textContent=style+' · '+Math.round(n/v.length*100)+' %';const bar=document.createElement('div');bar.className='bar';const span=document.createElement('span');span.style.width=(n/v.length*100)+'%';bar.append(span);m.append(p,bar)}if(!v.length)m.textContent='Aucun vote';$('challenge').textContent=ch[0]?ch[0].title+' — '+ch[0].description:'Aucun défi en cours';const target=$('memory');target.replaceChildren();if(mem.length){const x=mem[(frame++)%mem.length];const name=document.createElement('strong');name.textContent=x.guest_name||'Un invité';const msg=document.createElement('p');msg.textContent=x.message||'';target.append(name,msg);if(x.photo_path){const img=document.createElement('img');img.className='photo';img.alt='Souvenir partagé';img.src=c.supabaseUrl+'/storage/v1/object/public/kiwi-party-photos/'+x.photo_path;target.append(img)}}else target.textContent='Les souvenirs apparaîtront ici après validation.'}catch(e){$('event').textContent='Connexion indisponible : '+e.message}}refresh();setInterval(refresh,12000)</script></body></html>
