<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ KIWI · Propose ton son</title>
<style>body{margin:0;background:#0c1210;color:#eff7ee;font:16px system-ui}main{max-width:520px;margin:auto;padding:24px 18px}.logo{text-align:center;font-size:34px;font-weight:900;color:#b8ff72}.sub{text-align:center;color:#9cae9f}.card{background:#18231d;padding:20px;border-radius:18px;margin-top:22px}label{display:block;margin:15px 0 5px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #405447;border-radius:10px;background:#0d1711;color:white;font:inherit}button{width:100%;margin-top:20px;padding:15px;background:#b8ff72;color:#13200f;border:0;border-radius:12px;font-weight:800;font-size:16px}button:disabled{opacity:.6}small{color:#a9b8ab}#status{margin-top:14px}</style></head>
<body><main><div class="logo">🥝 DJ KIWI</div><div class="sub">SONORISATION · MUSIC REQUEST</div><div class="card"><h2>🎵 Propose ton son !</h2><p id="event">Recherche de la soirée en cours…</p><form id="request" hidden><label>Titre de la musique *</label><input name="title" required maxlength="120" placeholder="Ex. Freed From Desire"><label>Artiste (facultatif)</label><input name="artist" maxlength="120" placeholder="Ex. Gala"><label>Ton prénom (facultatif)</label><input name="guest" maxlength="50" placeholder="Ex. Julie"><button>Envoyer ma demande 🎶</button></form><div id="status" role="status"></div></div><p class="sub"><small>Le DJ choisit les titres selon l'ambiance. Une demande ne garantit pas sa diffusion.</small></p></main>
<script src="config.js?v=kiwi-v2-2"></script><script>
const c=window.KIWI_CONFIG,form=document.querySelector('#request'),eventLabel=document.querySelector('#event'),status=document.querySelector('#status');let activeEvent=null;
async function req(path,opts={}){const r=await fetch(c.supabaseUrl+path,{...opts,headers:{apikey:c.supabaseAnonKey,'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw Error('HTTP '+r.status+' : '+(await r.text()).slice(0,180));return r.status===204?null:r.json()}
async function refreshEvent(){try{const ev=await req('/rest/v1/dj_events?select=id,name&closed_at=is.null&limit=1');activeEvent=ev[0]||null;eventLabel.textContent=activeEvent?'Soirée : '+activeEvent.name+' · Propose ton titre !':'Aucune soirée ouverte pour le moment.';form.hidden=!activeEvent;}catch(e){form.hidden=true;eventLabel.textContent='Connexion indisponible';status.textContent=e.message}}
form.addEventListener('submit',async e=>{e.preventDefault();const btn=form.querySelector('button');if(!activeEvent)return;const d=Object.fromEntries(new FormData(form));btn.disabled=true;try{await req('/rest/v1/music_requests',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({title:d.title.trim(),artist:d.artist.trim(),guest_name:d.guest.trim()||'Invité',event_id:activeEvent.id})});status.textContent='✅ Demande envoyée à DJ KIWI !';form.reset()}catch(err){status.textContent='❌ Envoi impossible : '+err.message+' (la soirée a peut-être été clôturée)';await refreshEvent()}finally{btn.disabled=false}});
refreshEvent();setInterval(refreshEvent,30000);
</script></body></html>
