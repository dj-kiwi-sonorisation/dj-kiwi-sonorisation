<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ KIWI • Music Request</title><style>body{margin:0;background:#0c1210;color:#eff7ee;font:16px system-ui}main{max-width:520px;margin:auto;padding:24px 18px}.logo{text-align:center;font-size:34px;font-weight:900;color:#b8ff72}.sub{text-align:center;color:#9cae9f}.card{background:#18231d;padding:20px;border-radius:18px;margin-top:22px}label{display:block;margin:15px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #405447;border-radius:10px;background:#0d1711;color:white;font:inherit}button{width:100%;margin-top:20px;padding:15px;background:#b8ff72;color:#13200f;border:0;border-radius:12px;font-weight:800;font-size:16px}small{color:#a9b8ab}#status{margin-top:14px}</style></head><body><main><div class="logo">🥝 DJ KIWI</div><div class="sub">SONORISATION · MUSIC REQUEST</div><div class="card"><h2>🎵 Propose ton son !</h2><p>Une musique te ferait plaisir ? Fais ta demande au DJ. Il choisira selon l'ambiance de la soirée.</p><form id="request"><label>Titre de la musique *</label><input name="title" required maxlength="120" placeholder="Ex. Freed From Desire"><label>Artiste *</label><input name="artist" required maxlength="120" placeholder="Ex. Gala"><label>Ton prénom (facultatif)</label><input name="guest" maxlength="50" placeholder="Ex. Julie"><button>Envoyer ma demande 🎶</button></form><div id="status" role="status"></div></div><p class="sub"><small>Les demandes ne garantissent pas la diffusion du titre.</small></p></main><script src="config.js?v=4"></script><script>document.querySelector('#request').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,btn=form.querySelector('button'),status=document.querySelector('#status');if(!window.KIWI_CONFIG?.supabaseUrl||!window.KIWI_CONFIG?.supabaseAnonKey){status.textContent='Version de démonstration : la connexion aux demandes n’est pas encore configurée.';return}const data=Object.fromEntries(new FormData(form));btn.disabled=true;try{const r=await fetch(window.KIWI_CONFIG.supabaseUrl+'/rest/v1/music_requests',{method:'POST',headers:{'apikey':window.KIWI_CONFIG.supabaseAnonKey,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({title:data.title.trim(),artist:data.artist.trim(),guest_name:data.guest.trim()||'Invité'})});if(!r.ok){let detail=await r.text();throw Error('HTTP '+r.status+' : '+detail.slice(0,300))}status.textContent='✅ Demande envoyée à DJ KIWI !';form.reset()}catch(err){status.textContent='❌ Envoi impossible : '+err.message}finally{btn.disabled=false}})</script></body></html>
