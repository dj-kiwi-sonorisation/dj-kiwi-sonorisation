<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ KIWI · Gestion des soirées</title><style>
body{background:#101713;color:#fff;font:16px system-ui;max-width:950px;margin:auto;padding:20px}input,button,select{padding:11px;border-radius:8px;border:1px solid #536953;margin:4px;background:#1c2920;color:white}button{background:#b8ff72;color:#142010;border:0;font-weight:bold;cursor:pointer}button.danger{background:#ffdddd;color:#6e1414}button.secondary{background:#304335;color:white}.item,.panel{background:#1c2920;padding:14px;border-radius:12px;margin:10px 0}small{color:#c2d1c2}h1{font-size:25px}.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.item p{color:#c2d1c2}.hidden,[hidden]{display:none!important}.pill{font-size:12px;padding:3px 8px;border-radius:20px;background:#304335}#msg{white-space:pre-wrap}
</style></head><body><h1>🥝 DJ KIWI · Tableau DJ</h1><p>Demandes musicales et historique par soirée</p>
<div id="login"><input id="email" type="email" placeholder="Email DJ" autocomplete="username"><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password"><button id="connect">Connexion</button></div>
<div id="controls" hidden><div class="bar"><button id="refresh">Actualiser</button><button id="logout" class="secondary">Déconnexion</button><span id="sync"></span></div>
<div class="panel"><strong>Soirée active</strong><div id="active"></div><div class="bar"><input id="eventName" maxlength="120" placeholder="Ex. Mariage Julie & Thomas"><button id="newEvent">Nouvelle soirée</button><button id="closeEvent" class="danger">Clôturer la soirée</button></div><small>Clôture la soirée actuelle avant d'en créer une autre. Le QR code reste identique.</small></div>
<div class="panel"><label>Afficher : <select id="eventSelect"></select></label><label>Statut : <select id="filter"><option value="todo">À gérer</option><option value="played">Passées</option><option value="refused">Refusées</option><option value="all">Toutes</option></select></label></div><div id="list"></div><p id="count"></p></div><p id="msg" role="status"></p>
<script src="config.js?v=kiwi-v2-1"></script><script>
const c=window.KIWI_CONFIG,msg=document.querySelector('#msg'),$=id=>document.getElementById(id);let token='',events=[],requests=[],selectedEvent='',busy=false;
async function api(path,opts={}){const r=await fetch(c.supabaseUrl+path,{...opts,headers:{apikey:c.supabaseAnonKey,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw Error('HTTP '+r.status+' : '+(await r.text()).slice(0,250));if(r.status===204)return null;const txt=await r.text();return txt?JSON.parse(txt):null}
function showError(e){msg.textContent='❌ '+e.message}
$('connect').onclick=async()=>{try{const r=await fetch(c.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Connexion refusée');token=d.access_token;$('login').hidden=true;$('controls').hidden=false;await load()}catch(e){showError(e)}};
async function load(){if(!token||busy)return;busy=true;try{events=await api('/rest/v1/dj_events?select=id,name,created_at,closed_at&order=created_at.desc&limit=500');const active=events.find(e=>!e.closed_at);$('active').textContent=active?active.name+' (ouverte)':'Aucune soirée ouverte';$('closeEvent').disabled=!active;$('newEvent').disabled=!!active;
const select=$('eventSelect'),previous=selectedEvent;select.replaceChildren();for(const ev of events){const o=document.createElement('option');o.value=ev.id;o.textContent=ev.name+(ev.closed_at?' · clôturée':' · en cours');select.append(o)}
selectedEvent=events.some(e=>e.id===previous)?previous:(active?.id||events[0]?.id||'');select.value=selectedEvent;await loadRequests();$('sync').textContent='Mis à jour : '+new Date().toLocaleTimeString('fr-FR');msg.textContent=''}catch(e){showError(e)}finally{busy=false}}
async function loadRequests(){requests=selectedEvent?await api('/rest/v1/music_requests?select=id,title,artist,guest_name,status,created_at&event_id=eq.'+encodeURIComponent(selectedEvent)+'&order=created_at.desc&limit=1000'):[];render()}
function render(){const list=$('list'),filter=$('filter').value;list.replaceChildren();const filtered=requests.filter(x=>filter==='all'||(filter==='todo'&&['pending','accepted'].includes(x.status))||x.status===filter);for(const x of filtered){const box=document.createElement('div');box.className='item';const h=document.createElement('strong');h.textContent=x.title+' — '+x.artist;box.append(h);const p=document.createElement('p');p.textContent=(x.guest_name||'Invité')+' · '+new Date(x.created_at).toLocaleString('fr-FR')+' · '+({pending:'En attente',accepted:'Acceptée',played:'Passée',refused:'Refusée'}[x.status]||x.status);box.append(p);
const buttons=document.createElement('div');buttons.className='bar';for(const [value,label] of [['accepted','Accepter'],['played','Passée'],['refused','Refuser']]){const b=document.createElement('button');b.textContent=label;b.disabled=x.status===value;b.onclick=async()=>{try{await api('/rest/v1/music_requests?id=eq.'+encodeURIComponent(x.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:value})});await loadRequests()}catch(e){showError(e)}};buttons.append(b)}
const del=document.createElement('button');del.className='danger';del.textContent='Supprimer';del.onclick=async()=>{if(!confirm('Supprimer définitivement « '+x.title+' » ? Cette action est irréversible.'))return;try{await api('/rest/v1/music_requests?id=eq.'+encodeURIComponent(x.id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await loadRequests()}catch(e){showError(e)}};buttons.append(del);box.append(buttons);list.append(box)}$('count').textContent=filtered.length+' demande(s) affichée(s) sur '+requests.length+' (1000 maximum par soirée).'}
$('eventSelect').onchange=async e=>{selectedEvent=e.target.value;try{await loadRequests()}catch(err){showError(err)}};$('filter').onchange=render;$('refresh').onclick=load;
$('newEvent').onclick=async()=>{const name=$('eventName').value.trim();if(!name){msg.textContent='Saisis le nom de la soirée.';return}if(events.some(e=>!e.closed_at)){msg.textContent='Clôture d’abord la soirée en cours.';return}try{await api('/rest/v1/dj_events',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({name})});$('eventName').value='';selectedEvent='';await load()}catch(e){showError(e)}};
$('closeEvent').onclick=async()=>{const active=events.find(e=>!e.closed_at);if(!active)return;if(!confirm('Clôturer « '+active.name+' » ? Les invités ne pourront plus ajouter de demandes avant une nouvelle soirée.'))return;try{await api('/rest/v1/dj_events?id=eq.'+encodeURIComponent(active.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({closed_at:new Date().toISOString()})});await load()}catch(e){showError(e)}};
$('logout').onclick=()=>{token='';events=[];requests=[];$('controls').hidden=true;$('login').hidden=false;msg.textContent='Déconnecté'};
setInterval(()=>{if(token&&!document.hidden)load()},10000);
</script></body></html>
