<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ KIWI • Gestion</title><style>body{background:#101713;color:#fff;font:16px system-ui;max-width:800px;margin:auto;padding:20px}input,button{padding:12px;border-radius:8px;border:0;margin:5px}button{background:#b8ff72;color:#142010;font-weight:bold}.item{background:#1c2920;padding:14px;border-radius:12px;margin:10px 0}small{color:#c2d1c2}</style></head><body><h1>🥝 DJ KIWI · Tableau DJ</h1><p>Connexion privée pour consulter et gérer les demandes.</p><div id="login"><input id="email" type="email" placeholder="Email DJ"><input id="password" type="password" placeholder="Mot de passe"><button id="connect">Connexion</button></div><div id="controls" hidden><button id="refresh">Actualiser</button><button id="logout">Déconnexion</button><div id="list"></div></div><p id="msg"></p><script src="config.js"></script><script>let token='';const c=window.KIWI_CONFIG, msg=document.querySelector('#msg');async function api(path,options={}){let r=await fetch(c.supabaseUrl+path,{...options,headers:{apikey:c.supabaseAnonKey,Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error('Erreur '+r.status);return r.status===204?null:r.json()}document.querySelector('#connect').onclick=async()=>{try{if(!c.supabaseUrl)throw Error('Configurer config.js');let r=await fetch(c.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});let d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Connexion refusée');token=d.access_token;document.querySelector('#login').hidden=true;document.querySelector('#controls').hidden=false;await load()}catch(e){msg.textContent=e.message}};async function load(){try{const data=await api('/rest/v1/music_requests?select=id,title,artist,guest_name,status,created_at&order=created_at.desc&limit=200');const list=document.querySelector('#list');list.replaceChildren();for(const x of data){const box=document.createElement('div');box.className='item';const h=document.createElement('strong');h.textContent=x.title+' — '+x.artist;box.append(h);const p=document.createElement('p');p.textContent=(x.guest_name||'Invité')+' · '+new Date(x.created_at).toLocaleString('fr-FR')+' · '+x.status;box.append(p);for(const [value,label] of [['accepted','Accepter'],['played','Passée'],['refused','Refuser']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await api('/rest/v1/music_requests?id=eq.'+encodeURIComponent(x.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:value})});await load()}catch(e){msg.textContent=e.message}};box.append(b)}list.append(box)}msg.textContent=data.length+' demande(s)'}catch(e){msg.textContent=e.message}}document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=()=>{token='';location.reload()};</script></body></html>
